    <!-- Base -->
    <rect x="0" y="58" width="38" height="8" rx="3" fill="#c9a84c"/>
    <!-- Cuerpo -->
    <rect x="6" y="34" width="26" height="26" rx="3" fill="#c9a84c"/>
    <!-- Cuello -->
    <rect x="10" y="26" width="18" height="10" rx="2" fill="#c9a84c"/>
    <!-- Cabeza -->
    <rect x="7" y="10" width="24" height="18" rx="5" fill="#c9a84c"/>
    <!-- Cruz vertical -->
    <rect x="17" y="4" width="6" height="22" rx="2" fill="#c9a84c"/>
    <!-- Cruz horizontal -->
    <rect x="11" y="10" width="18" height="6" rx="2" fill="#c9a84c"/>
  </g>
</svg>
