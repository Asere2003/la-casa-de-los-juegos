<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fondo verde -->
  <rect width="100" height="100" rx="12" fill="#1a5c2a"/>

  <!-- Pieza de ajedrez centrada -->
